[project]
name = "vard-reuniao"
version = "0.1.0"
description = "Vard: modo reunião (captura WASAPI, VAD, transcrição, diarização) em 127.0.0.1:4720"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PyAudioWPatch==0.2.12.9",
  "silero-vad==6.2.3",
  "torch==2.11.0",
  "torchaudio==2.11.0",
  "numpy",
  "scipy",
  "soundfile",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pyannote.audio==4.0.7",
  "huggingface_hub",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vard_reuniao"]
