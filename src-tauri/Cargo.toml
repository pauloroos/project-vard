[package]
name = "vard"
version = "0.8.0"
description = "Vard: interface de voz local para assistentes"
authors = ["Paulo Roos"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "openjarvis_hud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.4.1"
xcap = "0.9.8"
image = "0.25.10"
base64 = "0.23.1"
url = "2"
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
regex = "1"
getrandom = "0.2"
lazy_static = "1"
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"

