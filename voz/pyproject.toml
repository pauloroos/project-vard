[project]
name = "vard-voz"
version = "0.1.0"
description = "Vard: serviço local de voz (XTTS v2, Suad Qasim) em 127.0.0.1:4710"
requires-python = ">=3.12,<3.13"
dependencies = [
  "coqui-tts==0.27.5",
  "transformers==4.57.6",
  "torchcodec==0.17.0",
  "torch==2.11.0",
  "torchaudio==2.11.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "soundfile",
  "numpy",
  "num2words>=0.5.14",
]

[project.optional-dependencies]
stt = ["faster-whisper>=1.1.0", "av>=14.0.0"]
edge = ["edge-tts>=6.1"]
piper = ["piper-tts>=1.2"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vard_voz"]