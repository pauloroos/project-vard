[project]
name = "vard-nucleo"
version = "0.8.0"
description = "Vard: ponte, MCPs e módulos do Vard"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "mcp>=2",
    "pywin32>=306; sys_platform == 'win32'",
    "mss>=9.0",
    "python-multipart>=0.0.9",
    "psutil>=7.2.2",
    "pystray>=0.19.5",
    "pillow>=12.3.0",
    "tomli-w>=1.2.0",
    "markdown>=3.7",
]

[dependency-groups]
dev = [
    "jiwer>=4.0.0",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vard"]

# Inclui módulos de topo (server, MCPs, preflight) e recursos do viewer dentro do wheel.
[tool.hatch.build.targets.wheel.force-include]
"server.py" = "vard/server.py"
"consulta_mcp.py" = "vard/consulta_mcp.py"
"memoria_mcp.py" = "vard/memoria_mcp.py"
"mesa_mcp.py" = "vard/mesa_mcp.py"
"oficina_mcp.py" = "vard/oficina_mcp.py"
"reuniao_mcp.py" = "vard/reuniao_mcp.py"
"preflight.py" = "vard/preflight.py"
"viewer" = "vard/viewer"